[project]
name = "weatherops"
version = "0.1.0"
description = ""
authors = [
    {name = "Carlos Rafael Senra Brito"}
]
requires-python = ">=3.12,<3.15"
dependencies = [
    "dvc (>=3.67.0,<4.0.0)",
    "pandas (>=2.2.0,<3.0.0)",
    "pydantic (>=2.12.5,<3.0.0)",
    "pydantic-settings (>=2.9.0,<3.0.0)",
    "plotly (>=6.6.0,<7.0.0)",
    "nbformat (>=5.10.4,<6.0.0)",
    "torch (>=2.3.0,<3.0.0)",
    "mlflow (>=3.0.0,<4.0.0)",
    "scikit-learn (>=1.5.0,<2.0.0)",
    "joblib (>=1.4.0,<2.0.0)",
    "fastapi (>=0.115.0,<1.0.0)",
    "uvicorn[standard] (>=0.34.0,<1.0.0)",
    "pytorch-forecasting (>=1.1.0,<2.0.0)",
    "lightning (>=2.4.0,<3.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ipykernel (>=7.2.0,<8.0.0)",
    "pytest (>=9.0.2,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "httpx (>=0.28.1,<0.29.0)"
]

[tool.poetry]
packages = [
    { include = "core" },
    { include = "src" }
]

[tool.pytest.ini_options]
testpaths = ["test"]
python_files = ["test_*.py"]
addopts = "-ra"
markers = [
    "unit: fast unit tests",
    "integration: slower integration tests"
]

[tool.coverage.run]
source = ["core", "src"]

[tool.coverage.report]
fail_under = 60
show_missing = true
