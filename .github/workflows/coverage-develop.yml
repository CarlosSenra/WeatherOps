name: Coverage Tests - Develop

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  coverage:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest

      - name: Install dependencies (dev + agent)
        run: |
          poetry install --without api --with dev --with agent  --no-interaction

      - name: Run coverage tests
        run: poetry run pytest --cov=core --cov=src --cov-report=term-missing --cov-fail-under=60
